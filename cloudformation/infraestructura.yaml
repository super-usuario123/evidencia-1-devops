AWSTemplateFormatVersion: '2010-09-09'
Description: Infraestructura base para proyecto DevOps con EC2 y S3

Resources:
  DevOpsS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: evidencia-devops-leomeza-2026-02

  DevOpsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group para instancia EC2 del proyecto DevOps
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  DevOpsEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-05f991c49d264708f
      SecurityGroupIds:
        - !Ref DevOpsSecurityGroup
      Tags:
        - Key: Name
          Value: DevOps-EC2-Instance

Outputs:
  InstanceId:
    Description: ID de la instancia EC2 creada
    Value: !Ref DevOpsEC2Instance

  BucketName:
    Description: Nombre del bucket S3 creado
    Value: !Ref DevOpsS3Bucket
